name: Build Tauri 2.0 Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ui/src-tauri/target/
          key: windows-cargo-x86_64-pc-windows-msvc-${{ hashFiles('ui/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-x86_64-pc-windows-msvc-

      - name: Sync Python environment and build sidecar
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          cd api
          uv sync
          uv run --with pyinstaller python build_sidecar.py x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: |
          cd ui
          npm install

      - name: Build Tauri Desktop Application
        run: |
          cd ui
          npx tauri build --target x86_64-pc-windows-msvc

      - name: Prepare Portable Distribution
        shell: bash
        run: |
          mkdir -p dist-portable
          cp ui/src-tauri/target/x86_64-pc-windows-msvc/release/onthespot.exe dist-portable/OnTheSpot.exe
          cp ui/src-tauri/binaries/ots-backend-x86_64-pc-windows-msvc.exe dist-portable/ots-backend.exe

      - name: Upload Portable Windows App (Direct Run - No Install Required)
        uses: actions/upload-artifact@v4
        with:
          name: OnTheSpot-Windows-x64-Portable
          path: dist-portable/*

      - name: Upload Installer Packages (NSIS & MSI)
        uses: actions/upload-artifact@v4
        with:
          name: OnTheSpot-Windows-x64
          path: |
            ui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            ui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

  build-macos:
    name: Build macOS Apple Silicon (M1/M2/M3)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ui/src-tauri/target/
          key: macos-cargo-aarch64-apple-darwin-${{ hashFiles('ui/src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-cargo-aarch64-apple-darwin-

      - name: Sync Python environment and build sidecar
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          cd api
          uv sync
          uv run --with pyinstaller python build_sidecar.py aarch64-apple-darwin

      - name: Install frontend dependencies
        run: |
          cd ui
          npm install

      - name: Build Tauri Desktop Application
        run: |
          cd ui
          npx tauri build --target aarch64-apple-darwin

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnTheSpot-macOS-AppleSilicon-M1
          path: |
            ui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            ui/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') && always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
