[package]
name = "onthespot"
version = "2.0.3"
description = "OnTheSpot Music & Media Downloader"
authors = ["OnTheSpot Team"]
edition = "2021"

[lib]
name = "onthespot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
